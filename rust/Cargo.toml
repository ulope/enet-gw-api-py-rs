[package]
name = "enet-gw-api-py-rs"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "enet_gw_api_py_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py38"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
# Vendored forks of the upstream crates: enet-client adds blinds support,
# enet-proto accepts the gateway's PascalCase device types.
enet-client = { path = "vendor/enet-client" }
enet-proto = { path = "vendor/enet-proto" }
eventuals = "0.6"
tokio = { version = "1", features = ["sync"] }
# Bridge the vendored crates' `tracing` logs into Python's `logging`.
# `log-always` makes `tracing` emit `log` records unconditionally, which
# `pyo3-log` then forwards to Python.
tracing = { version = "0.1", features = ["log-always"] }
log = "0.4"
pyo3-log = "0.13"
