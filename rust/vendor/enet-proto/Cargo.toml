# Vendored fork of `enet-proto` v0.1.7 (https://github.com/YoloDev/enet-rs).
#
# Patched locally so the project-item `TYPE` field accepts the gateway's
# PascalCase device types (e.g. "Binaer") in addition to the UPPERCASE form
# the upstream release expects. See src/res/proj.rs.

[package]
edition = "2021"
name = "enet-proto"
version = "0.1.7"
authors = ["Aleksander Heintz <alxandr@alxandr.me>"]
description = "eNet gateway protocol types (vendored fork)"
license = "MIT"
repository = "https://github.com/YoloDev/enet-rs"
resolver = "2"

[dependencies]
bytes = "1"
color-eyre = "0.5"
derive_more = "0.99"
enum-kinds = "0.5"
lazy_static = "1"
regex = { version = "1", features = ["std", "perf"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde-aux = "3"
serde_json = "1"
smol_str = "0.1"
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
serde_test = "1"
